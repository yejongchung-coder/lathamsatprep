services:
  - type: web
    name: lathamsatprep
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Single worker: inquiries use SQLite, which is not safe with concurrent writers.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      # NOTE: values set in the Render dashboard OVERRIDE these. After changing
      # render.yaml, update the dashboard env vars too (or the site keeps the old number).
      - key: TEXT_NUMBER
        value: +15187389750
      - key: TEXT_NUMBER_DISPLAY
        value: (518) 738-9750
      # Set these in the Render dashboard (never commit secrets):
      # INQUIRY_KEY -> shared secret for the SID inquiry-watch job
